services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-dev}"
        COMMIT: "${COMMIT:-none}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    ports:
      - "8099:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/site.db
      - APP_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./data:/data
    restart: unless-stopped
