<div class="container">
    <span class="section__chapter">05</span>
    <h2 class="text-xl uppercase">Contact</h2>

    <div class="grid-50-50" style="margin-top: var(--space-xl);">
        <!-- Contact Info -->
        <div>
            <div class="text-mono-sm text-accent" style="margin-bottom: var(--space-md);">[ LET'S CONNECT ]</div>
            <p style="margin-bottom: var(--space-lg);">
                I'm always interested in hearing about new opportunities, collaboration ideas, 
                or just having a good conversation about technology and networking. 
            </p>

            <div style="border-top: 1px solid var(--clr-border);">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--clr-border); padding: var(--space-sm) 0;">
                    <span class="text-mono-sm text-muted">GITHUB</span>
                    <span class="text-mono-sm"><a href="https://www.github.com/C4risrocks" target="_blank" rel="noopener">C4risrocks</a></span>
                </div>
            </div>
        </div>

        <!-- Contact Form -->
        <div>
            <form style="display: flex; flex-direction: column; gap: var(--space-md);"
                  x-data="{
                      name: '',
                      email: '',
                      message: '',
                      errors: {},
                      submitted: false,
                      validate() {
                          this.errors = {};
                          if (!this.name.trim()) this.errors.name = 'Name is required';
                          if (!this.email.trim()) this.errors.email = 'Email is required';
                          else if (!this.email.includes('@')) this.errors.email = 'Valid email is required';
                          if (!this.message.trim()) this.errors.message = 'Message is required';
                          return Object.keys(this.errors).length === 0;
                      },
                      get isValid() {
                          return this.name.trim() && this.email.includes('@') && this.message.trim();
                      }
                  }"
                  hx-post="/api/contact"
                  hx-target="#contact-response"
                  hx-swap="innerHTML"
                  @htmx:after-request="if(event.detail.successful) { name=''; email=''; message=''; submitted=true; }">

                <div id="contact-response" role="status" aria-live="polite"></div>

                <div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--clr-border); padding-bottom: var(--space-xs);">
                    <label for="contact-name" class="text-mono-sm text-muted">FULL NAME</label>
                    <input type="text" 
                           id="contact-name" 
                           name="name" 
                           x-model="name"
                           style="background: transparent; border: none; color: var(--clr-text); font-family: var(--font-display); font-size: 1.5rem; outline: none; margin-top: var(--space-xs);"
                           placeholder="..."
                           required>
                    <span class="text-mono-sm text-accent" x-show="errors.name" x-text="errors.name"></span>
                </div>

                <div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--clr-border); padding-bottom: var(--space-xs);">
                    <label for="contact-email" class="text-mono-sm text-muted">EMAIL</label>
                    <input type="email" 
                           id="contact-email" 
                           name="email" 
                           x-model="email"
                           style="background: transparent; border: none; color: var(--clr-text); font-family: var(--font-display); font-size: 1.5rem; outline: none; margin-top: var(--space-xs);"
                           placeholder="..."
                           required>
                    <span class="text-mono-sm text-accent" x-show="errors.email" x-text="errors.email"></span>
                </div>

                <div style="display: flex; flex-direction: column; border-bottom: 1px solid var(--clr-border); padding-bottom: var(--space-xs);">
                    <label for="contact-message" class="text-mono-sm text-muted">MESSAGE</label>
                    <textarea id="contact-message" 
                              name="message" 
                              x-model="message"
                              style="background: transparent; border: none; color: var(--clr-text); font-family: var(--font-display); font-size: 1.5rem; outline: none; margin-top: var(--space-xs); resize: vertical;"
                              placeholder="..."
                              rows="3"
                              required></textarea>
                    <span class="text-mono-sm text-accent" x-show="errors.message" x-text="errors.message"></span>
                </div>

                <div style="margin-top: var(--space-sm);">
                    <button type="submit" 
                            class="btn" 
                            :disabled="!isValid"
                            @click="validate()">
                        Send Message
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
