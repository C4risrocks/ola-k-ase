<div class="container">
    <span class="section__chapter">02</span>
    <h2 class="text-xl uppercase">Technical Skills</h2>
    <p class="hero__sub" style="margin-bottom: var(--space-xl);">A broad range of technical competencies across networking, security, and software development.</p>

    <div class="grid-border">
        {{ range . }}
        <div>
            <div class="text-mono-sm text-accent" style="margin-bottom: var(--space-md);">[ {{ .Category }} ]</div>
            
            <div style="display: flex; flex-direction: column; gap: var(--space-xs);" x-data="{ items: '{{ .Items }}'.split(', ') }">
                <template x-for="item in items" :key="item">
                    <div style="display: flex; align-items: center; gap: var(--space-sm);">
                        <span style="color: var(--clr-border);">—</span>
                        <span class="text-mono-sm" x-text="item"></span>
                    </div>
                </template>
            </div>
        </div>
        {{ end }}
    </div>
</div>
