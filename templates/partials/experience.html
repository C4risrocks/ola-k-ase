<div class="container">
    <span class="section__chapter">03</span>
    <h2 class="text-xl uppercase">Experience</h2>
    <p class="hero__sub" style="margin-bottom: var(--space-xl);">Building expertise through hands-on work in networking, development, and security.</p>

    <div style="border-top: 1px solid var(--clr-border);">
        {{ range . }}
        <div class="row-item">
            <div class="row-item__meta text-mono-sm">
                {{ .DateRange }}<br>
                <span class="text-accent">{{ .Organization }}</span>
            </div>
            <div>
                <h3 class="font-display" style="font-size: 2rem; margin-bottom: var(--space-sm);">{{ .Title }}</h3>
                <p style="margin-bottom: var(--space-md);">{{ .Description }}</p>
                {{ if .Details }}
                <div style="display: flex; flex-direction: column; gap: var(--space-xs);">
                    {{ range .Details }}
                    <div style="display: flex; gap: var(--space-sm);">
                        <span style="color: var(--clr-accent);">*</span>
                        <span>{{ . }}</span>
                    </div>
                    {{ end }}
                </div>
                {{ end }}
            </div>
        </div>
        {{ end }}
    </div>
</div>
