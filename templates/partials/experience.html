<div class="container">
    <div class="section__header reveal">
        <span class="section__label">Career</span>
        <h2 class="section__title">Professional Experience</h2>
        <p class="section__subtitle">Building expertise through hands-on work in networking, development, and security</p>
    </div>

    <div class="timeline stagger-children">
        {{ range . }}
        <div class="timeline__item">
            <div class="timeline__dot"></div>
            <div class="timeline__card">
                <span class="timeline__date">📅 {{ .DateRange }}</span>
                <h3 class="timeline__title">{{ .Title }}</h3>
                <p class="timeline__org">{{ .Organization }}</p>
                <p class="timeline__desc">{{ .Description }}</p>
                {{ if .Details }}
                <ul class="timeline__details">
                    {{ range .Details }}
                    <li class="timeline__detail">{{ . }}</li>
                    {{ end }}
                </ul>
                {{ end }}
            </div>
        </div>
        {{ end }}
    </div>
</div>
