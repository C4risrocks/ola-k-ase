<div class="container">
    <span class="section__chapter">04</span>
    <h2 class="text-xl uppercase">Education</h2>
    
    <div class="grid-50-50" style="margin-top: var(--space-xl);">
        <!-- Academic Education -->
        <div>
            <div class="text-mono-sm text-accent" style="margin-bottom: var(--space-lg);">[ ACADEMIC EDUCATION ]</div>
            <div style="border-top: 1px solid var(--clr-border);">
                {{ range .Education }}
                <div style="padding: var(--space-md) 0; border-bottom: 1px solid var(--clr-border);">
                    <h4 class="font-display" style="font-size: 1.5rem; margin-bottom: var(--space-xs);">{{ .Degree }}</h4>
                    <p class="text-mono-sm text-muted">{{ .Institution }}</p>
                    {{ if .DateRange }}
                    <p class="text-mono-sm" style="margin-top: var(--space-xs);">{{ .DateRange }}</p>
                    {{ end }}
                </div>
                {{ end }}
                
                <!-- Languages -->
                <div style="padding: var(--space-md) 0; border-bottom: 1px solid var(--clr-border);">
                    <h4 class="font-display" style="font-size: 1.5rem; margin-bottom: var(--space-xs);">Languages</h4>
                    <div style="display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-xs);">
                        <div style="display: flex; justify-content: space-between;">
                            <span class="text-mono-sm text-muted">SPANISH</span>
                            <span class="text-mono-sm">NATIVE</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span class="text-mono-sm text-muted">ENGLISH</span>
                            <span class="text-mono-sm">FLUENT</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Courses & Certifications -->
        <div>
            <div class="text-mono-sm text-accent" style="margin-bottom: var(--space-lg);">[ CERTIFICATIONS ]</div>
            <div style="border-top: 1px solid var(--clr-border);">
                {{ range .Courses }}
                <div style="padding: var(--space-md) 0; border-bottom: 1px solid var(--clr-border);">
                    <h4 class="font-display" style="font-size: 1.5rem; margin-bottom: var(--space-xs);">{{ .Name }}</h4>
                    <p class="text-mono-sm text-muted">{{ .Institution }}</p>
                    <p class="text-mono-sm" style="margin-top: var(--space-xs);">{{ .DateRange }}</p>
                </div>
                {{ end }}
            </div>
        </div>
    </div>
</div>
